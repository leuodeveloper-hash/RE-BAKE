<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Bakle</title>
    <meta name="description" content="초보 베이커부터 장인까지, 레시피를 기록하고 다음엔 더 맛있게." />

    <!-- 링크 미리보기(카카오톡·페이스북·X 등) — 모든 주소에서 같은 카드가 뜬다.
         이미지는 같은 폴더의 og-image.png(1200×630)가 https://bakle.app/og-image.png 로 올라간다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakle" />
    <meta property="og:url" content="https://bakle.app" />
    <meta property="og:title" content="Bakle · 일상적 레시피, 베이클로 시작" />
    <meta property="og:description" content="초보 베이커부터 장인까지, 레시피를 기록하고 다음엔 더 맛있게." />
    <meta property="og:image" content="https://bakle.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bakle · 일상적 레시피, 베이클로 시작" />
    <meta name="twitter:description" content="초보 베이커부터 장인까지, 레시피를 기록하고 다음엔 더 맛있게." />
    <meta name="twitter:image" content="https://bakle.app/og-image.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
